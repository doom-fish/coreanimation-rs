[package]
name = "coreanimation-rs"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/coreanimation-rs"
repository = "https://github.com/doom-fish/coreanimation-rs"
description = "Safe Rust bindings for Apple's QuartzCore/CoreAnimation framework — layers, animations, display links, and offscreen Metal rendering on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["coreanimation", "quartzcore", "metal", "macos", "apple"]
categories = ["api-bindings", "graphics", "os::macos-apis"]
rust-version = "1.82"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "examples/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
    "COVERAGE.md",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "coreanimation"
crate-type = ["lib"]

[features]
default = []
raw-ffi = []

[dependencies]
libc = "0.2"
apple-cf = { path = "../apple-cf-rs", version = ">=0.11, <0.12", default-features = false, features = ["cg", "cv"] }
apple-metal = { path = "../apple-metal-rs", version = ">=0.10, <0.11" }
doom-fish-utils = { path = "../doom-fish-utils", version = ">=0.4.1, <0.5" }

[dev-dependencies]
# Cap the transitive bitflags that can be pulled into the dev/test build:
# bitflags 2.12.0 overflows the macro recursion limit while compiling some
# downstream crates, which breaks `--all-targets`/`--all-features` lint and
# test builds. This is a dev-only constraint and does not affect the published
# dependency set.
bitflags = ">=2.0, <2.12"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[[example]]
name = "01_layer_render_smoke"

[[test]]
name = "transaction_completion_tests"
harness = false

[[test]]
name = "animation_delegate_main_thread_tests"
harness = false

[profile.release]
debug = "full"
strip = "none"
