[package]
name = "coreanimation-rs"
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/coreanimation-rs"
repository = "https://github.com/doom-fish/coreanimation-rs"
description = "Safe Rust bindings for Apple's QuartzCore/CoreAnimation framework — layers, animations, display links, and offscreen Metal rendering on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["coreanimation", "quartzcore", "metal", "macos", "apple"]
categories = ["api-bindings", "graphics", "os::macos-apis"]
rust-version = "1.76"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "examples/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
    "COVERAGE.md",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "coreanimation"
crate-type = ["lib"]

[features]
default = []
raw-ffi = []

[dependencies]
libc = "0.2"
apple-cf = { version = ">=0.7, <0.9", default-features = false, features = ["cg"] }
apple-metal = { version = ">=0.5, <0.9" }

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[[example]]
name = "01_layer_render_smoke"

[profile.release]
debug = "full"
strip = "none"
